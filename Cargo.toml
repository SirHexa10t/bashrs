[package]
name = "bashrs"
version = "0.1.0"
edition = "2021"

[workspace]
members = ["macros"]

[dependencies]
clap = { version = "4", features = ["derive"] }
bashrs-macros = { path = "macros" }
table_formatter = { git = "https://github.com/SirHexa10t/table_formatter.git", branch = "main" }
filesync = { git = "https://github.com/SirHexa10t/backup_sync.git", branch = "main" }
vidl = { git = "https://github.com/SirHexa10t/vidl.git", branch = "main" }   # the yt-dlp driver behind `dl`
synoptic = "2"
libc = "0.2"
toml = "1.1"
serde_json = "1"
grep = "0.4"          # ripgrep's search engine, run in-process by the lookup/style search commands
regex = "1"           # regex::escape for the g/gg literal (-F) mode — already fully in the tree via synoptic + table_formatter, so this adds zero crates
ignore = "0.4"        # ripgrep's parallel .gitignore-aware directory walker — the `gg` tree search
termcolor = "1"       # colour selection (ColorChoice) for grep's Standard printer
console = "0.16"      # ANSI-escape stripping (strip_ansi_codes) for `lll`'s .lnk detection
minimad = "0.16"      # line-based Markdown parser — `doc_render` emits its own ANSI from this
lofty = "0.24"        # in-place audio metadata writes — `dl --audio`'s subtitle tags, no python needed
