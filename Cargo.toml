[package]
name = "bashrs"
version = "0.1.0"
edition = "2021"

[workspace]
members = ["macros"]

[dependencies]
clap = { version = "4", features = ["derive"] }
bashrs-macros = { path = "macros" }
table_formatter = { git = "https://github.com/SirHexa10t/table_formatter.git", branch = "main" }
synoptic = "2"
libc = "0.2"
toml = "0.8"
serde_json = "1"
grep = "0.4"          # ripgrep's search engine, run in-process by the lookup/style search commands
ignore = "0.4"        # ripgrep's parallel .gitignore-aware directory walker — the `gg` tree search
termcolor = "1"       # colour selection (ColorChoice) for grep's Standard printer
console = "0.16"      # ANSI-escape stripping (strip_ansi_codes) for `lll`'s .lnk detection
