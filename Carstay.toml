# Non-Cargo dependencies as provisioned on this machine — rewritten by `bashrs install-stainless`
# (COMPILE.sh / brs_compile) after every sync, all sections in one move. Commit it
# alongside code: when an upstream release breaks something, `git log Carstay.toml`
# names the last-known-good versions — and `./COMPILE.sh --use-stable-carstay` provisions THESE
# recorded versions instead of the latest releases (the file becomes the input then,
# and is not rewritten). Values are release tags (ffmpeg: its release channel @ the
# month-end build it came from); repos record their clone's commit; "system" means
# the machine provides the tool itself, so nothing was bundled.

[tools]
ffmpeg = "n9.0 @ autobuild-2026-09-30-13-08"
yt-dlp = "2026.10.21"
uv = "0.13.5"
python = "3.14.6"
deno = "v2.9.8"
git-lfs = "v3.8.0"

[stainless_comfy]
contAInerized = "3957d9b2ba2cfe4911bbb9cee211b03366a6fb18"
